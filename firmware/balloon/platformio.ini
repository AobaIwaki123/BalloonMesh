[platformio]
default_envs = balloon

[env]
platform = espressif32@6.9.0
framework = arduino, espidf
platform_packages =
    framework-espidf@~3.40407.0
board = seeed_xiao_esp32c3
board_build.partitions = partitions.csv
monitor_speed = 115200
upload_speed = 115200
upload_flags = --no-stub
lib_extra_dirs = ../shared
build_flags =
    -I../shared/balloon_core/include
    -I../shared/balloon_common/include
    -DBM_ROLE_BALLOON
    -DBM_FIRMWARE_VERSION=\"0.1.0\"

; Fleet firmware.  Provisioning, keys and the unicast address come from a real
; provisioner and are restored from NVS after a reboot.
[env:balloon]
build_flags =
    ${env.build_flags}
    -DBM_ENABLE_POSITIONING=1

; BLE Mesh only bring-up (Protocol A / FTM disabled).
[env:balloon-mesh-bringup]
build_flags =
    ${env.build_flags}
    -DBM_ENABLE_POSITIONING=0

; Bench profiles only.  BM_DEV_AUTO_PROV erases NVS on every boot (LED queue
; snapshot and mesh settings included) and joins the network with compiled-in
; development keys, so it must never be flashed onto fleet hardware.
[env:balloon-dev]
build_flags =
    ${env.build_flags}
    -DBM_ENABLE_POSITIONING=1
    -DBM_DEV_AUTO_PROV=1

[env:balloon-dev-mesh-bringup]
build_flags =
    ${env.build_flags}
    -DBM_ENABLE_POSITIONING=0
    -DBM_DEV_AUTO_PROV=1
