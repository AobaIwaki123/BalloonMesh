[platformio]
default_envs = balloon

[env:balloon]
platform = espressif32@6.9.0
framework = arduino
board = esp32-c3-devkitm-1
board_build.partitions = huge_app.csv
monitor_speed = 115200
lib_extra_dirs = ../shared
build_flags =
    -I../shared/balloon_core/include
    -I../shared/balloon_common/include
    -DCONFIG_BLE_MESH_NODE=1
    -DBM_ROLE_BALLOON
    -DBM_FIRMWARE_VERSION=\"0.1.0\"
