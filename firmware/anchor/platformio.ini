[platformio]
default_envs = anchor

[env:anchor]
platform = espressif32@6.9.0
framework = arduino
board = seeed_xiao_esp32c3
board_build.partitions = huge_app.csv
monitor_speed = 115200
lib_extra_dirs = ../shared
build_flags =
    -I../shared/balloon_core/include
    -I../shared/balloon_common/include
    -DBM_ROLE_ANCHOR
    -DBM_ANCHOR_ID=1
    -DBM_FIRMWARE_VERSION=\"0.1.0\"
